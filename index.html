<!-- <!doctype html> -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Transfer</title>
    <meta name="description" content="Transfer files between devices using QR codes — no server, no internet required.">
    <meta name="theme-color" content="#0d6efd">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" href="./favicon.svg">
    <link rel="manifest" href="./manifest.json">
    <style>
        :root {
            --text-muted: #666;
            --text-error: #dc3545;
            --logo-invert: 0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-muted: #999;
                --text-error: #ff6b6b;
                --logo-invert: 0.85;
            }
        }

        svg {
            max-width: 400px !important;
            max-height: 400px !important;
            width: 100% !important;
            height: auto !important;
        }

        .float {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        /* following 3 to centralize page */
        #inner-div {
            margin-left: auto;
            margin-right: auto;
            max-width: 600px;
            width: 100%;
            padding: 0 16px;
            box-sizing: border-box;
        }

        #middle-div {
            display: table-cell;
            vertical-align: middle
        }

        #outer-div {
            display: table;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
        }
    </style>
    <!-- <script src="//cdn.bootcdn.net/ajax/libs/eruda/2.3.3/eruda.js"></script>
    <script>eruda.init();</script> -->
</head>

<script>
    console.log("Initializing wasm...");
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('Service worker registered, scope:', reg.scope),
            (err) => console.warn('Service worker registration failed:', err)
        );
    }
</script>

<body>
    <div id="main"> </div>
    <div id="spinner">
        <div class="d-flex align-items-center">
            <strong>Loading...</strong>
            <div class="spinner-border ms-auto" role="status" aria-hidden="true"></div>
        </div>
    </div>
</body>

</html>
